name: Desktop

on:
  workflow_dispatch:
  push:
    branches: [main, codex/reliability]
    paths:
      - "packages/desktop/**"
      - "packages/shared/**"
      - "packages/daemon/**"
      - ".github/workflows/desktop.yml"
      - "scripts/update-village-renderer*"
      - "scripts/test-desktop.sh"
      - "pnpm-lock.yaml"
  pull_request:
    branches: [main, codex/reliability]
    paths:
      - "packages/desktop/**"
      - "packages/shared/**"
      - "packages/daemon/**"
      - ".github/workflows/desktop.yml"
      - "scripts/update-village-renderer*"
      - "scripts/test-desktop.sh"
      - "pnpm-lock.yaml"

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Report toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Test Swift package
        run: ./scripts/test-desktop.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test village renderer contract
        run: |
          npx pnpm install --frozen-lockfile --filter autopod
          node --test packages/desktop/Tests/VillageHost/*.test.mjs scripts/update-village-renderer.test.mjs
          npx pnpm village:check

      - name: Build macOS app
        run: >-
          xcodebuild
          -project packages/desktop/Autopod.xcodeproj
          -scheme Autopod
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
