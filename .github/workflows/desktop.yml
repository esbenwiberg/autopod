name: Desktop UI diagnosis (PR 616)

# This workflow lives on the diagnostic branch only. It is not a merge gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ui-pr616-diagnostics
  cancel-in-progress: false

jobs:
  diagnose-ui:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 79ba556b733f7d0a6e38a1b5c3b86e3ab08213b8
          persist-credentials: false

      - name: Verify source and toolchain
        run: |
          mkdir -p ui-diagnostics
          touch ui-diagnostics/test-start
          [[ "$(git rev-parse HEAD)" == 79ba556b733f7d0a6e38a1b5c3b86e3ab08213b8 ]]
          { git rev-parse HEAD; sw_vers; swift --version; xcodebuild -version; } | tee ui-diagnostics/toolchain.log

      - name: Add temporary checkpoints to the suspect test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/desktop/Tests/AutopodUITests/DesktopDetailNavigationTests.swift')
          code = p.read_text()
          start = code.index('    @Test func sortAndDensitySurviveCloseReopen()')
          end = code.index('\n    @Test ', start + 1)
          test = code[start:end]
          markers = [
              ('let host = try DesktopSelectionPerformanceHost', 'create host'),
              ('try await host.selectTab("work")', 'select work tab'),
              ('try host.selectFleetSegment("Last Active")', 'select sort'),
              ('try host.selectFleetSegment("Compact")', 'select density'),
              ('try await host.wait { preferencesRetained() }', 'await preferences'),
              ('#expect(host.press(try #require(host.find(id: "detail-close"))))', 'close detail'),
              ('try await host.wait { host.find(id: "detail-close")', 'await close'),
              ('#expect(host.press(try #require(host.find(label:', 'reopen detail'),
              ('try await host.wait { host.destination("work")', 'await reopen'),
          ]
          for line, label in markers:
              needle = '        ' + line
              assert test.count(needle) == 1, label
              test = test.replace(needle, f'        print("[ui-checkpoint] {label}")\n' + needle, 1)
          test = test.replace('defer { host.close() }', 'defer {\n            print("[ui-checkpoint] teardown")\n            host.close()\n        }', 1)
          p.write_text(code[:start] + test + code[end:])
          PY
          git diff --check
          git diff > ui-diagnostics/checkpoints.patch

      - name: Build the Swift test bundle and verify the UI inventory
        timeout-minutes: 12
        run: |
          swift test --package-path packages/desktop list 2>&1 | tee ui-diagnostics/build-and-inventory.log
          grep -m 1 '^AutopodUITests\..*sortAndDensitySurviveCloseReopen' ui-diagnostics/build-and-inventory.log

      - name: Run the focused test, then its navigation suite
        timeout-minutes: 10
        run: |
          export NSUnbufferedIO=YES
          evidence="$PWD/ui-diagnostics"
          run_case() {
            local name="$1" filter="$2"
            (
              sleep 35
              for attempt in 1 2 3; do
                printf '\n=== %s UTC ===\n' "$(date -u +%FT%T)"
                ps -axo pid,ppid,etime,state,rss,comm | grep -E 'swift-test|AutopodDesktopPackageTests|xctest' || true
                for pid in $(pgrep -f '[A]utopodDesktopPackageTests.xctest' || true); do
                  /usr/bin/sample "$pid" 2 10 -file "$evidence/$name-sample-$attempt-$pid.txt" || true
                done
                sleep 35
              done
            ) >> "$evidence/$name-process.log" 2>&1 &
            sampler=$!
            set +e
            python3 -u - "$filter" <<'PY' 2>&1 | tee "$evidence/$name-tests.log"
          import os
          import signal
          import subprocess
          import sys

          proc = subprocess.Popen(['swift', 'test', '--package-path', 'packages/desktop',
                                   '--skip-build', '--no-parallel', '--filter', sys.argv[1]],
                                  start_new_session=True)
          try:
              rc = proc.wait(timeout=160)
          except subprocess.TimeoutExpired:
              print('diagnostic_deadline_seconds=160; stopping owned test process group', flush=True)
              for sig in (signal.SIGTERM, signal.SIGKILL):
                  try:
                      os.killpg(proc.pid, sig)
                  except ProcessLookupError:
                      pass
                  try:
                      proc.wait(timeout=3)
                  except subprocess.TimeoutExpired:
                      pass
              sys.exit(124)
          print(f'raw_swift_exit={rc}', flush=True)
          sys.exit(rc if rc >= 0 else 128 - rc)
          PY
            local exit_codes=("${PIPESTATUS[@]}")
            set -e
            kill "$sampler" 2>/dev/null || true
            printf 'swift_test_exit=%s\ntee_exit=%s\n' "${exit_codes[0]}" "${exit_codes[1]}" | tee "$evidence/$name-exit.txt"
            [[ "${exit_codes[0]}" == 0 && "${exit_codes[1]}" == 0 ]] || return 1
            grep -Eq 'Test run with [1-9][0-9]* tests? .*passed' "$evidence/$name-tests.log"
          }
          run_case focused sortAndDensitySurviveCloseReopen
          run_case navigation DesktopDetailNavigationTests

      - name: Collect new crash reports for the test runner
        if: always()
        run: |
          mkdir -p ui-diagnostics/crashes
          if [[ -f ui-diagnostics/test-start ]]; then
            for reports in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
              [[ -d "$reports" ]] || continue
              find "$reports" -maxdepth 2 -type f -newer ui-diagnostics/test-start \
                \( -name 'AutopodDesktopPackageTests*.ips' -o -name 'AutopodDesktopPackageTests*.crash' \
                   -o -name 'swift-test*.ips' -o -name 'swift-test*.crash' -o -name 'xctest*.ips' -o -name 'xctest*.crash' \) \
                -exec cp -n {} ui-diagnostics/crashes/ \; || true
            done
          fi
          ls -l ui-diagnostics/crashes | tee ui-diagnostics/crash-inventory.txt

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr616-ui-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ui-diagnostics/
          if-no-files-found: error
          retention-days: 7
