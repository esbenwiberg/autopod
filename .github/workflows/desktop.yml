name: Desktop

# Native validation is full/nightly coverage, not a routine PR gate.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Report toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Test Swift package
        run: |
          mkdir -p .ci-results
          ./scripts/test-desktop.sh 2>&1 | tee .ci-results/swift-tests.log

      # Read packageManager from package.json; never let npx fetch a newer major.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test village renderer contract
        run: |
          "$PNPM_HOME/pnpm" install --frozen-lockfile --filter autopod
          node --test packages/desktop/Tests/VillageHost/*.test.mjs scripts/update-village-renderer.test.mjs
          "$PNPM_HOME/pnpm" village:check

      - name: Build macOS app
        run: >-
          xcodebuild
          -project packages/desktop/Autopod.xcodeproj
          -scheme Autopod
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          2>&1 | tee .ci-results/xcodebuild.log

      - name: Upload native validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-results/
          retention-days: 14
